<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teal Future OS - Massive</title>
    <style>
        :root {
            --teal: #00f2ff;
            --dark-teal: #004d4d;
            --bg: #050b0c;
        }

        body, html {
            margin: 0; padding: 0;
            background: var(--bg);
            color: var(--teal);
            font-family: 'Courier New', monospace;
            overflow: hidden; height: 100vh;
        }

        #canvas { position: absolute; top: 0; left: 0; z-index: 1; }

        /* 右上角工具栏 */
        .tools {
            position: absolute; top: 20px; right: 20px; z-index: 100;
        }

        .tool-btn {
            background: rgba(0, 242, 255, 0.1);
            border: 1px solid var(--teal);
            color: var(--teal);
            padding: 5px 15px;
            cursor: pointer;
            font-size: 12px;
            backdrop-filter: blur(5px);
            transition: 0.3s;
            pointer-events: auto;
        }

        .tool-btn:hover { background: var(--teal); color: var(--bg); }

        .main-interface {
            position: relative; z-index: 10;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            height: 100vh; pointer-events: none;
        }

        /* --- 修改：圆圈包装器显著放大 --- */
        .clock-wrapper {
            position: relative; 
            width: 500px; /* 从 350px 放大 */
            height: 500px; /* 从 350px 放大 */
            display: flex; justify-content: center; align-items: center;
            pointer-events: auto;
        }

        /* --- 修改：能量环 SVG 放大 --- */
        .energy-ring { 
            position: absolute; 
            transform: rotate(-90deg); 
            filter: drop-shadow(0 0 15px var(--teal)); /* 增强光晕 */
        }

        /* --- 修改：调整进度条和背景环参数 --- */
        .ring-bg {
            fill: none;
            stroke: rgba(0, 77, 77, 0.2);
            stroke-width: 4; /* 加粗一点 */
        }

        .ring-progress { 
            fill: none; 
            stroke: var(--teal); 
            stroke-width: 4; /* 加粗一点 */
            stroke-dasharray: 1414; /* 新的周长：2 * PI * 225 */
            stroke-dashoffset: 1414; 
            transition: stroke-dashoffset 1s linear; 
        }

        /* --- 修改：时钟文字放大 --- */
        #time { font-size: 96px; /* 从 64px 放大 */ font-weight: bold; text-shadow: 0 0 25px var(--teal); }
        
        /* 音频控制区域 */
        #controls { pointer-events: auto; margin-top: 20px; text-align: center; }
        
        /* --- 修改：控制按钮样式稍微优化 --- */
        .control-btn {
            background: transparent; border: 1px solid var(--teal);
            color: var(--teal); padding: 10px 20px;
            cursor: pointer; margin: 0 8px;
            font-size: 12px;
            transition: 0.3s;
        }
        .control-btn:hover { background: rgba(0, 242, 255, 0.1); }

        #song-title { font-size: 11px; margin-top: 10px; opacity: 0.6; letter-spacing: 1px; }

        /* --- 新功能样式：音量条 --- */
        #visualizer-container {
            margin-top: 20px;
            width: 300px;
            height: 10px;
            border: 1px solid rgba(0, 242, 255, 0.2);
            position: relative;
            overflow: hidden;
        }
        #volume-bar {
            height: 100%;
            background: var(--teal);
            width: 0%; /* 初始宽度 */
            transition: width 0.1s linear; /* 平滑过渡 */
            filter: drop-shadow(0 0 5px var(--teal));
        }

        /* 系统日志样式 */
        #log-container {
            position: absolute; bottom: 20px; left: 20px;
            width: 350px; height: 120px; font-size: 11px;
            color: #008080; overflow: hidden;
            display: flex; flex-direction: column-reverse;
            z-index: 100;
            pointer-events: none;
        }
        .log-entry { margin-bottom: 4px; animation: flash 0.2s; }
        @keyframes flash { from { color: white; } to { color: #008080; } }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="tools">
        <button class="tool-btn" onclick="toggleFullScreen()">[ FULLSCREEN MODE ]</button>
    </div>

    <div id="log-container"></div>

    <div class="main-interface">
        <div class="clock-wrapper">
            <svg class="energy-ring" width="480" height="480">
                <circle class="ring-bg" cx="240" cy="240" r="225"></circle>
                <circle id="progress-bar" class="ring-progress" cx="240" cy="240" r="225"></circle>
            </svg>
            <div style="text-align: center;">
                <div id="time">00:00:00</div>
                <div id="date" style="letter-spacing: 2px; font-size: 16px; margin-top: 10px;">BOOTING SYSTEM...</div>
            </div>
        </div>

        <div id="controls">
            <button class="control-btn" id="play-btn">START CORE AUDIO</button>
            <button class="control-btn" id="next-btn">NEXT TRACK</button>
            <div id="song-title">AUDIO SYSTEM READY</div>
            
            <center>
                <div id="visualizer-container">
                    <div id="volume-bar"></div>
                </div>
            </center>
        </div>
        
        <audio id="song" loop preload="auto" crossOrigin="anonymous"></audio>
    </div>

    <script>
        // --- 1. 系统日志 ---
        const logBox = document.getElementById('log-container');
        function addLog(msg, isError = false) {
            const div = document.createElement('div');
            div.className = 'log-entry';
            if(isError) div.style.color = '#ff4d4d';
            div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logBox.prepend(div);
            if(logBox.childNodes.length > 8) logBox.lastChild.remove();
        }

        // --- 2. 歌曲库 (保持你的文件名不变) ---
        const playlist = [
            { name: "Atlas Relax", url: "atlasaudio-relax-511892.mp3" },
            { name: "Teal Protocol", url: "the_mountain-relax-508021 (1).mp3" }
        ];
        let currentTrackIndex = 0;

        const song = document.getElementById('song');
        const songTitle = document.getElementById('song-title');
        const playBtn = document.getElementById('play-btn');
        const volumeBar = document.getElementById('volume-bar');

        // --- 新功能的核心：Web Audio API 音量可视化 ---
        let audioContext, analyser, dataArray, source;
        let isVisualizerSetup = false;

        function setupVisualizer() {
            if (isVisualizerSetup) return;
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                source = audioContext.createMediaElementSource(song);
                source.connect(analyser);
                analyser.connect(audioContext.destination);
                analyser.fftSize = 256; // 设置精细度
                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                isVisualizerSetup = true;
                addLog("AUDIO VISUALIZER INITIALIZED.");
                drawVisualizer();
            } catch (e) {
                addLog("VISUALIZER ERROR: REQUIRES HTTP(S)", true);
                // 注意：如果是在本地直接双击打开 HTML，Web Audio API 可能无法工作。
                // 必须在 GitHub Pages (HTTP) 上运行。
            }
        }

        function drawVisualizer() {
            if (!isVisualizerSetup || song.paused) {
                volumeBar.style.width = "0%";
                if(song.paused) return; // 停止循环
            }

            requestAnimationFrame(drawVisualizer);
            analyser.getByteFrequencyData(dataArray);

            // 计算音量（这里使用频率数据的平均值作为音量）
            let values = 0;
            for (let i = 0; i < dataArray.length; i++) {
                values += dataArray[i];
            }
            const average = values / dataArray.length;
            
            // 将 0-255 的平均值转换为 0-100 的百分比
            const volumePercentage = (average / 128) * 100;
            volumeBar.style.width = Math.min(volumePercentage, 100) + "%";
        }

        function loadTrack(index) {
            const track = playlist[index];
            song.src = track.url;
            songTitle.innerText = `NOW PLAYING: ${track.name}`;
            addLog(`LOADING TRACK: ${track.name}...`);
            
            song.onerror = () => {
                addLog(`ERROR: CANNOT FIND ${track.url}`, true);
                songTitle.innerText = "FILE NOT FOUND (CHECK CAPITALS)";
            };
        }

        loadTrack(0);

        playBtn.addEventListener('click', () => {
            if (song.paused) {
                // 浏览器要求用户交互后才能启动 AudioContext
                if (!isVisualizerSetup) setupVisualizer(); 
                if (audioContext && audioContext.state === 'suspended') audioContext.resume();

                song.play().then(() => {
                    playBtn.innerText = "HALT AUDIO";
                    addLog("AUDIO STREAM ESTABLISHED.");
                    drawVisualizer(); // 开始绘制
                }).catch(err => {
                    addLog("INTERACTION REQUIRED TO START AUDIO", true);
                });
            } else {
                song.pause();
                playBtn.innerText = "START AUDIO";
                addLog("AUDIO STREAM TERMINATED.");
                // drawVisualizer 会因为 song.paused 自动停止
            }
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            song.play().then(() => {
                if (audioContext && audioContext.state === 'suspended') audioContext.resume();
                drawVisualizer();
            });
            playBtn.innerText = "HALT AUDIO";
        });

        // --- 3. 全屏功能 ---
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                addLog("FULLSCREEN MODE ENGAGED.");
            } else {
                document.exitFullscreen();
                addLog("FULLSCREEN MODE TERMINATED.");
            }
        }

        // --- 4. 时钟逻辑 ---
        const timeEl = document.getElementById('time');
        const dateEl = document.getElementById('date');
        const progressBar = document.getElementById('progress-bar');
        const CIRCUMFERENCE = 1414; // 新的周长

        function updateClock() {
            const now = new Date();
            timeEl.innerText = now.toLocaleTimeString('en-GB');
            dateEl.innerText = now.toDateString().toUpperCase();
            const s = now.getSeconds();
            // 每秒重置时的平滑处理
            if (s === 0) progressBar.style.transition = 'none';
            else progressBar.style.transition = 'stroke-dashoffset 1s linear';
            progressBar.style.strokeDashoffset = CIRCUMFERENCE - (s / 60) * CIRCUMFERENCE;
        }
        setInterval(updateClock, 1000);
        updateClock();
        addLog("SYSTEM CLOCK SYNCED.");

        // --- 5. 粒子背景 ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        window.onresize();
        class P { constructor(x,y){this.x=x;this.y=y;this.l=1;this.s=Math.random()*2;} update(){this.x+=Math.random()*2-1;this.y+=Math.random()*2-1;this.l-=0.01;} draw(){ctx.fillStyle=`rgba(0,242,255,${this.l})`;ctx.beginPath();ctx.arc(this.x,this.y,this.s,0,7);ctx.fill();}}
        window.onmousemove = (e) => { for(let i=0;i<2;i++) particles.push(new P(e.x,e.y)) };
        function anim() { ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach((p,i)=>{p.update();p.draw();if(p.l<=0)particles.splice(i,1)}); requestAnimationFrame(anim); }
        anim();
    </script>
</body>
</html>

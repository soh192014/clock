<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="Screenshot_20260510_203622_com_android_chrome_CustomTabActivity_edit_855563587456178.jpg " type="image/x-icon"> 
    <title>Teal Future OS - Wave Progress</title>
    <style>
        :root {
            --teal: #00f2ff;
            --dark-teal: #004d4d;
            --bg: #050b0c;
        }

        body, html {
            margin: 0; padding: 0;
            background: var(--bg);
            color: var(--teal);
            font-family: 'Courier New', monospace;
            overflow: hidden; height: 100vh;
        }

        #bg-canvas { position: absolute; top: 0; left: 0; z-index: 1; }

        .main-interface {
            position: relative; z-index: 10;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            height: 100vh; pointer-events: none;
        }

        /* 超大圆圈 */
        .clock-wrapper {
            position: relative; 
            width: 600px; height: 600px; 
            display: flex; justify-content: center; align-items: center;
            pointer-events: auto;
        }

        .energy-ring { 
            position: absolute; 
            transform: rotate(-90deg); 
            filter: drop-shadow(0 0 20px var(--teal));
        }

        .ring-progress { 
            fill: none; stroke: var(--teal); stroke-width: 6; 
            stroke-dasharray: 1884; stroke-dashoffset: 1884; 
            transition: stroke-dashoffset 1s linear; 
        }

        #time { font-size: 110px; font-weight: bold; text-shadow: 0 0 30px var(--teal); }

        /* --- 新功能：波形进度条容器 --- */
        #visualizer-wrapper {
            margin-top: 50px;
            width: 500px;
            height: 100px;
            position: relative;
            pointer-events: auto;
        }

        #wave-canvas {
            width: 100%;
            height: 100%;
            border-bottom: 1px solid rgba(0, 242, 255, 0.3);
        }

        #controls { pointer-events: auto; margin-top: 20px; text-align: center; }
        .control-btn {
            background: transparent; border: 1px solid var(--teal);
            color: var(--teal); padding: 10px 20px; cursor: pointer;
            margin: 0 10px; font-size: 13px;
        }

        #log-container {
            position: absolute; bottom: 20px; left: 20px;
            width: 300px; height: 80px; font-size: 11px;
            color: var(--dark-teal); overflow: hidden;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div id="log-container"></div>

    <div class="main-interface">
        <div class="clock-wrapper">
            <svg class="energy-ring" width="620" height="620">
                <circle cx="310" cy="310" r="300" fill="none" stroke="rgba(0,242,255,0.05)" stroke-width="2"></circle>
                <circle id="progress-bar" class="ring-progress" cx="310" cy="310" r="300"></circle>
            </svg>
            <div style="text-align: center;">
                <div id="time">00:00:00</div>
                <div id="date" style="font-size: 18px; opacity: 0.7;">LOADING...</div>
            </div>
        </div>

        <div id="visualizer-wrapper">
            <canvas id="wave-canvas"></canvas>
        </div>

        <div id="controls">
            <button class="control-btn" id="play-btn">INITIALIZE CORE</button>
            <button class="control-btn" id="next-btn">NEXT TRACK</button>
            <div id="song-info" style="font-size: 11px; margin-top: 10px; opacity: 0.5;">IDLE</div>
        </div>
        
        <audio id="song" loop crossOrigin="anonymous"></audio>
    </div>

    <script>
        const playlist = [
            { n: "Atlas Relax", u: "atlasaudio-relax-511892.mp3" },
            { n: "Mountain Relax", u: "the_mountain-relax-508021 (1).mp3" }
        ];
        let idx = 0;

        const audio = document.getElementById('song');
        const waveCanvas = document.getElementById('wave-canvas');
        const waveCtx = waveCanvas.getContext('2d');
        const playBtn = document.getElementById('play-btn');

        // 设置画布分辨率
        function resizeWaveCanvas() {
            waveCanvas.width = waveCanvas.offsetWidth;
            waveCanvas.height = waveCanvas.offsetHeight;
        }
        window.addEventListener('resize', resizeWaveCanvas);
        resizeWaveCanvas();

        let aCtx, analyser, data;

        function initAudio() {
            if (aCtx) return;
            aCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = aCtx.createAnalyser();
            const source = aCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(aCtx.destination);
            analyser.fftSize = 256;
            data = new Uint8Array(analyser.frequencyBinCount);
            render();
        }

        function render() {
            requestAnimationFrame(render);
            const w = waveCanvas.width;
            const h = waveCanvas.height;
            waveCtx.clearRect(0, 0, w, h);

            // 1. 获取音频频率数据
            if (!audio.paused) {
                analyser.getByteFrequencyData(data);
            } else {
                data.fill(0); // 没音乐时平掉
            }

            // 2. 计算播放进度 (0 到 1)
            const progress = audio.duration ? audio.currentTime / audio.duration : 0;
            const progressX = w * progress;

            // 3. 绘制波形
            const barWidth = w / data.length;
            for (let i = 0; i < data.length; i++) {
                const barHeight = (data[i] / 255) * h * 0.8;
                const x = i * barWidth;
                const y = h - barHeight;

                // 判断颜色：如果在进度条左侧，用亮蓝色，右侧用暗色
                if (x < progressX) {
                    waveCtx.fillStyle = '#00f2ff';
                    waveCtx.shadowBlur = 10;
                    waveCtx.shadowColor = '#00f2ff';
                } else {
                    waveCtx.fillStyle = '#004d4d';
                    waveCtx.shadowBlur = 0;
                }

                // 绘制跳动的柱子（平时高度为2，看起来像条平线）
                waveCtx.fillRect(x, y - 2, barWidth - 1, barHeight + 2);
            }

            // 4. 绘制进度指示光点
            waveCtx.fillStyle = '#fff';
            waveCtx.fillRect(progressX - 1, 0, 2, h);
        }

        playBtn.onclick = () => {
            initAudio();
            if(aCtx.state === 'suspended') aCtx.resume();
            if(audio.paused) {
                audio.play();
                playBtn.innerText = "HALT SYSTEM";
            } else {
                audio.pause();
                playBtn.innerText = "INITIALIZE CORE";
            }
        };

        document.getElementById('next-btn').onclick = () => {
            idx = (idx + 1) % playlist.length;
            audio.src = playlist[idx].u;
            document.getElementById('song-info').innerText = `TRACK: ${playlist[idx].n}`;
            audio.play();
        };

        // 时钟和粒子背景 (保持原有逻辑)
        const prog = document.getElementById('progress-bar');
        setInterval(() => {
            const now = new Date();
            document.getElementById('time').innerText = now.toLocaleTimeString('en-GB');
            document.getElementById('date').innerText = now.toDateString().toUpperCase();
            prog.style.strokeDashoffset = 1884 - (now.getSeconds() / 60) * 1884;
        }, 1000);

        // 背景粒子
        const bgCvs = document.getElementById('bg-canvas');
        const bgCtx = bgCvs.getContext('2d');
        let ps = [];
        window.onresize = () => { bgCvs.width = window.innerWidth; bgCvs.height = window.innerHeight; };
        window.onresize();
        window.onmousemove = (e) => { ps.push({x:e.x, y:e.y, l:1}) };
        function anim() {
            bgCtx.clearRect(0,0,bgCvs.width,bgCvs.height);
            ps.forEach((p,i) => {
                p.l -= 0.01; bgCtx.fillStyle = `rgba(0,242,255,${p.l})`;
                bgCtx.fillRect(p.x, p.y, 2,

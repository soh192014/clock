<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Console v4.15 - Enhanced</title>
    <link rel="icon" href="Screenshot_20260510_203622_com_android_chrome_CustomTabActivity_edit_855563587456178.jpg" type="image/jpeg">
    <style>
        :root { --teal: #00f2ff; --bg: #050b0c; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: var(--teal); font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; }
        #bg-canvas { position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* 顶部状态栏 */
        #status-bar { position: absolute; top: 25px; left: 30px; z-index: 100; font-size: 11px; display: flex; flex-direction: column; gap: 8px; background: rgba(0, 242, 255, 0.05); padding: 12px; border: 1px solid rgba(0, 242, 255, 0.2); backdrop-filter: blur(5px); }
        .stat-item { display: flex; align-items: center; gap: 10px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 10px var(--teal); }

        #log-window { position: absolute; bottom: 30px; left: 30px; width: 350px; height: 120px; border-left: 2px solid var(--teal); padding: 10px; font-size: 11px; z-index: 100; display: flex; flex-direction: column-reverse; overflow: hidden; }
        .log-line { margin-bottom: 4px; opacity: 0.7; }

        .main-interface { position: relative; z-index: 10; display: flex; flex-direction: column; justify-content: space-around; align-items: center; height: 100vh; width: 100%; padding: 40px 0; box-sizing: border-box; pointer-events: none; }
        .clock-wrapper { position: relative; width: 560px; height: 560px; display: flex; justify-content: center; align-items: center; pointer-events: auto; }
        .energy-ring { position: absolute; transform: rotate(-90deg); filter: drop-shadow(0 0 15px var(--teal)); }
        .ring-progress { fill: none; stroke: var(--teal); stroke-width: 4; stroke-dasharray: 1696; stroke-dashoffset: 1696; transition: stroke-dashoffset 1s linear; }
        #time { font-size: 100px; font-weight: bold; text-shadow: 0 0 25px var(--teal); }
        #date { font-size: 18px; letter-spacing: 5px; opacity: 0.6; margin-top: 10px; }

        /* 音乐控制区 */
        #player-container { width: 450px; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: auto; }
        #viz-container { width: 100%; height: 60px; }
        
        /* 新增：歌曲时间线 */
        #timeline-container { width: 100%; height: 4px; background: rgba(0, 242, 255, 0.1); cursor: pointer; position: relative; }
        #timeline-fill { height: 100%; background: var(--teal); width: 0%; box-shadow: 0 0 10px var(--teal); }
        #time-display { width: 100%; display: flex; justify-content: space-between; font-size: 10px; opacity: 0.6; margin-top: 4px; }

        #controls { pointer-events: auto; text-align: center; margin-top: 10px; }
        .control-btn { background: transparent; border: 1px solid var(--teal); color: var(--teal); padding: 10px 20px; cursor: pointer; margin: 0 5px; font-size: 11px; transition: 0.3s; }
        .control-btn:hover { background: rgba(0, 242, 255, 0.2); }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    
    <div id="status-bar">
        <div class="stat-item"><div class="dot"></div><span id="wifi-signal">WiFi: SCANNING...</span></div>
        <div class="stat-item"><div class="dot"></div><span id="location-text">LOC: ACQUIRING...</span></div>
    </div>

    <div id="log-window"></div>

    <div class="main-interface">
        <div class="clock-wrapper">
            <svg class="energy-ring" width="560" height="560">
                <circle cx="280" cy="280" r="270" fill="none" stroke="rgba(0,242,255,0.05)" stroke-width="2"></circle>
                <circle id="progress-bar" class="ring-progress" cx="280" cy="280" r="270"></circle>
            </svg>
            <div style="text-align: center;">
                <div id="time">00:00:00</div>
                <div id="date">SYNCING...</div>
            </div>
        </div>

        <div id="player-container">
            <div id="viz-container"><canvas id="wave-canvas"></canvas></div>
            
            <div id="timeline-container">
                <div id="timeline-fill"></div>
            </div>
            <div id="time-display">
                <span id="curr-time">0:00</span>
                <span id="total-time">0:00</span>
            </div>

            <div id="controls">
                <div id="status-info" style="font-size: 10px; margin-bottom: 15px; opacity: 0.5;">OS READY</div>
                <button class="control-btn" id="play-btn">Connect</button>
                <button class="control-btn" id="next-btn">Next</button>
            </div>
        </div>
        
        <audio id="song" loop crossOrigin="anonymous"></audio>
    </div>

    <script>
        const logWindow = document.getElementById('log-window');
        const audio = document.getElementById('song');
        const timelineFill = document.getElementById('timeline-fill');
        const timelineContainer = document.getElementById('timeline-container');
        const currTimeText = document.getElementById('curr-time');
        const totalTimeText = document.getElementById('total-time');

        function pushLog(msg) {
            const line = document.createElement('div');
            line.className = 'log-line';
            line.innerText = `> ${msg}`;
            logWindow.prepend(line);
            if(logWindow.childNodes.length > 8) logWindow.lastChild.remove();
        }

        const playlist = [
            { n: "Atlas Relax", u: "atlasaudio-relax-511892.mp3" },
            { n: "Mountain Relax", u: "the_mountain-relax-508021 (1).mp3" },
            { n: "Fire Aura", u: "02.%20Fire%20Aura.mp3" }
        ];
        let idx = 0;

        // 格式化时间
        function formatTime(secs) {
            const mins = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${mins}:${s < 10 ? '0' : ''}${s}`;
        }

        // 更新时间线
        audio.ontimeupdate = () => {
            const pct = (audio.currentTime / audio.duration) * 100;
            timelineFill.style.width = `${pct}%`;
            currTimeText.innerText = formatTime(audio.currentTime);
            if(!isNaN(audio.duration)) totalTimeText.innerText = formatTime(audio.duration);
        };

        // 点击时间线跳转
        timelineContainer.onclick = (e) => {
            const rect = timelineContainer.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            audio.currentTime = pos * audio.duration;
        };

        function updateStats() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(p => {
                    document.getElementById('location-text').innerText = `LOC: ${p.coords.latitude.toFixed(2)}N, ${p.coords.longitude.toFixed(2)}E`;
                }, () => {}, {timeout:10000});
            }
            if (navigator.connection) {
                document.getElementById('wifi-signal').innerText = `WiFi: ${navigator.connection.downlink} Mbps`;
            }
        }
        updateStats(); setInterval(updateStats, 5000);

        const waveCanvas = document.getElementById('wave-canvas');
        const waveCtx = waveCanvas.getContext('2d');
        let aCtx, analyser, data;

        function setupAudio() {
            if (aCtx) return;
            aCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = aCtx.createAnalyser();
            const source = aCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(aCtx.destination);
            analyser.fftSize = 128;
            data = new Uint8Array(analyser.frequencyBinCount);
            renderWave();
        }

        function renderWave() {
            requestAnimationFrame(renderWave);
            const w = waveCanvas.width = waveCanvas.offsetWidth;
            const h = waveCanvas.height = waveCanvas.offsetHeight;
            waveCtx.clearRect(0, 0, w, h);
            if (!audio.paused) analyser.getByteFrequencyData(data);
            const barW = w / data.length;
            data.forEach((val, i) => {
                const barH = (val / 255) * h;
                waveCtx.fillStyle = '#00f2ff';
                waveCtx.fillRect(i * barW, h - barH, barW - 2, barH);
            });
        }

        document.getElementById('play-btn').onclick = () => {
            setupAudio();
            if(audio.paused) { 
                if(!audio.src) audio.src = playlist[idx].u;
                audio.play(); 
                pushLog(`CORE ACTIVE: ${playlist[idx].n}`); 
            }
            else { 
                audio.pause(); 
                pushLog("CORE STANDBY"); 
            }
        };

        document.getElementById('next-btn').onclick = () => {
            idx = (idx + 1) % playlist.length;
            audio.src = playlist[idx].u;
            document.getElementById('status-info').innerText = `OS.DATA: ${playlist[idx].n}`;
            pushLog(`LOADING DATA: ${playlist[idx].n}`);
            setupAudio();
            audio.play();
        };

        // 时钟逻辑
        setInterval(() => {
            const now = new Date();
            document.getElementById('time').innerText = now.toLocaleTimeString('en-GB');
            document.getElementById('date').innerText = now.toDateString().toUpperCase();
            document.getElementById('progress-bar').style.strokeDashoffset = 1696 - (now.getSeconds() / 60) * 1696;
        }, 1000);

        // 粒子引擎
        const bgCvs = document.getElementById('bg-canvas');
        const bgCtx = bgCvs.getContext('2d');
        let ps = [];
        bgCvs.width = window.innerWidth; bgCvs.height = window.innerHeight;

        const createP = (e) => {
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            for(let i=0; i<5; i++) ps.push({x, y, l:1, vx:(Math.random()-0.5)*2, vy:(Math.random()-0.5)*2});
        };
        window.onmousemove = createP; window.ontouchmove = createP;

        function anim() {
            bgCtx.clearRect(0,0,bgCvs.width,bgCvs.height);
            ps.forEach((p,i) => {
                p.l -= 0.015; p.x += p.vx; p.y += p.vy;
                bgCtx.fillStyle = `rgba(0,242,255,${p.l})`;
                bgCtx.fillRect(p.x, p.y, 1.5, 1.5);
                if(p.l <= 0) ps.splice(i,1);
            });
            requestAnimationFrame(anim);
        }
        anim();
        pushLog("SYSTEM ONLINE");
    </script>
</body>
</html>

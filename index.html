    <style>
        :root {
            --teal: #00f2ff;
            --dark-teal: #004d4d;
            --bg: #050b0c;
        }

        body, html {
            margin: 0; padding: 0;
            background: var(--bg);
            color: var(--teal);
            font-family: 'Courier New', monospace;
            overflow: hidden; height: 100vh;
        }

        #bg-canvas { position: absolute; top: 0; left: 0; z-index: 1; }

        .tools {
            position: absolute; top: 30px; right: 30px; z-index: 100;
        }

        .tool-btn {
            background: rgba(0, 242, 255, 0.05);
            border: 1px solid var(--teal);
            color: var(--teal);
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 2px;
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.2);
            transition: 0.4s;
            pointer-events: auto;
        }

        .tool-btn:hover { background: var(--teal); color: var(--bg); box-shadow: 0 0 25px var(--teal); }

            width: 380px; height: 150px;

            padding: 15px; font-size: 12px; color: var(--teal);
            overflow: hidden; z-index: 100; pointer-events: none;
            display: flex; flex-direction: column-reverse;
        }

        .log-line { margin-bottom: 6px; animation: fadeIn 0.3s ease; opacity: 0.7; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 0.7; transform: translateX(0); } }

        }

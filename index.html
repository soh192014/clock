<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teal Future OS - Massive Scale</title>
    <link rel="icon" href="Screenshot_20260510_203622_com_android_chrome_CustomTabActivity_edit_855563587456178.jpg " type="image/x-icon"> 
    <style>
        :root {
            --teal: #00f2ff;
            --dark-teal: #004d4d;
            --bg: #050b0c;
        }

        body, html {
            margin: 0; padding: 0;
            background: var(--bg);
            color: var(--teal);
            font-family: 'Courier New', monospace;
            overflow: hidden; height: 100vh;
        }

        #canvas { position: absolute; top: 0; left: 0; z-index: 1; }

        .tools {
            position: absolute; top: 20px; right: 20px; z-index: 100;
        }

        .tool-btn {
            background: rgba(0, 242, 255, 0.1);
            border: 1px solid var(--teal);
            color: var(--teal);
            padding: 8px 15px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(5px);
            pointer-events: auto;
        }

        .main-interface {
            position: relative; z-index: 10;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            height: 100vh; pointer-events: none;
        }

        /* --- 巨大的圆圈容器 --- */
        .clock-wrapper {
            position: relative; 
            width: 650px; /* 超大容器 */
            height: 650px; 
            display: flex; justify-content: center; align-items: center;
            pointer-events: auto;
        }

        /* --- 能量环放大 --- */
        .energy-ring { 
            position: absolute; 
            transform: rotate(-90deg); 
            filter: drop-shadow(0 0 20px var(--teal));
        }

        .ring-bg {
            fill: none;
            stroke: rgba(0, 242, 255, 0.05);
            stroke-width: 6;
        }

        .ring-progress { 
            fill: none; 
            stroke: var(--teal); 
            stroke-width: 8; 
            stroke-dasharray: 1884; /* 周长: 2 * PI * 300 */
            stroke-dashoffset: 1884; 
            transition: stroke-dashoffset 1s linear; 
            stroke-linecap: round;
        }

        /* --- 文字比例同步放大 --- */
        #time { font-size: 120px; font-weight: bold; text-shadow: 0 0 30px var(--teal); }
        #date { font-size: 20px; letter-spacing: 5px; opacity: 0.7; margin-top: 10px; }
        
        #controls { pointer-events: auto; margin-top: 40px; text-align: center; }
        
        .control-btn {
            background: transparent; border: 1px solid var(--teal);
            color: var(--teal); padding: 12px 25px;
            cursor: pointer; margin: 0 10px;
            font-size: 14px;
            text-transform: uppercase;
        }

        /* --- 音量波动条 --- */
        #viz-wrapper {
            margin-top: 30px;
            width: 400px;
            height: 4px;
            background: rgba(0, 242, 255, 0.1);
            position: relative;
        }
        #vol-bar {
            height: 100%;
            background: var(--teal);
            width: 0%;
            box-shadow: 0 0 15px var(--teal);
            transition: width 0.1s ease;
        }

        #log-container {
            position: absolute; bottom: 20px; left: 20px;
            width: 400px; height: 100px; font-size: 11px;
            color: var(--dark-teal); overflow: hidden;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="tools">
        <button class="tool-btn" onclick="toggleFullScreen()">[ MAXIMIZE CONSOLE ]</button>
    </div>

    <div id="log-container"></div>

    <div class="main-interface">
        <div class="clock-wrapper">
            <svg class="energy-ring" width="620" height="620">
                <circle class="ring-bg" cx="310" cy="310" r="300"></circle>
                <circle id="progress-bar" class="ring-progress" cx="310" cy="310" r="300"></circle>
            </svg>
            <div style="text-align: center;">
                <div id="time">00:00:00</div>
                <div id="date">SYNCING DATE...</div>
            </div>
        </div>

        <div id="controls">
            <button class="control-btn" id="play-btn">Initialize Audio</button>
            <button class="control-btn" id="next-btn">Skip Track</button>
            <div id="viz-wrapper"><div id="vol-bar"></div></div>
            <div id="song-name" style="margin-top: 15px; font-size: 12px; opacity: 0.5;">AWAITING COMMAND...</div>
        </div>
        
        <audio id="song" loop crossOrigin="anonymous"></audio>
    </div>

    <script>
        const logBox = document.getElementById('log-container');
        function addLog(msg) {
            const d = document.createElement('div');
            d.innerText = `> ${new Date().toLocaleTimeString()}: ${msg}`;
            logBox.prepend(d);
            if(logBox.childNodes.length > 5) logBox.lastChild.remove();
        }

        // --- 歌曲列表 ---
        const playlist = [
            { n: "Atlas Relax", u: "atlasaudio-relax-511892.mp3" },
            { n: "Mountain Relax", u: "the_mountain-relax-508021 (1).mp3" }
        ];
        let idx = 0;

        const audio = document.getElementById('song');
        const volBar = document.getElementById('vol-bar');
        const songName = document.getElementById('song-name');

        function load(i) {
            audio.src = playlist[i].u;
            songName.innerText = `TRACK: ${playlist[i].n}`;
            addLog(`MOUNTING: ${playlist[i].n}`);
        }
        load(0);

        // --- 音量分析器 ---
        let aCtx, analyser, data;
        function initViz() {
            if (aCtx) return;
            aCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = aCtx.createAnalyser();
            const source = aCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(aCtx.destination);
            data = new Uint8Array(analyser.frequencyBinCount);
            renderViz();
        }

        function renderViz() {
            requestAnimationFrame(renderViz);
            if(audio.paused) { volBar.style.width = "0%"; return; }
            analyser.getByteFrequencyData(data);
            let avg = data.reduce((a, b) => a + b) / data.length;
            volBar.style.width = (avg * 1.5) + "%";
        }

        document.getElementById('play-btn').onclick = () => {
            initViz();
            if(aCtx.state === 'suspended') aCtx.resume();
            if(audio.paused) {
                audio.play();
                document.getElementById('play-btn').innerText = "Halt System";
            } else {
                audio.pause();
                document.getElementById('play-btn').innerText = "Initialize Audio";
            }
        };

        document.getElementById('next-btn').onclick = () => {
            idx = (idx + 1) % playlist.length;
            load(idx);
            audio.play();
        };

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        // 时钟
        const bar = document.getElementById('progress-bar');
        const CIRC = 1884;
        setInterval(() => {
            const n = new Date();
            document.getElementById('time').innerText = n.toLocaleTimeString('en-GB');
            document.getElementById('date').innerText = n.toDateString().toUpperCase();
            bar.style.strokeDashoffset = CIRC - (n.getSeconds()/60)*CIRC;
        }, 1000);

        // 粒子
        const cvs = document.getElementById('canvas');
        const ctx = cvs.getContext('2d');
        let ps = [];
        window.onresize = () => { cvs.width = window.innerWidth; cvs.height = window.innerHeight; };
        window.onresize();
        window.onmousemove = (e) => { for(let i=0;i<3;i++) ps.push({x:e.x, y:e.y, l:1, s:Math.random()*2}) };
        function run() {
            ctx.clearRect(0,0,cvs.width,cvs.height);
            ps.forEach((p,i) => {
                p.x += Math.random()*2-1; p.y += Math.random()*2-1; p.l -= 0.01;
                ctx.fillStyle = `rgba(0,242,255,${p.l})`;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 7); ctx.fill();
                if(p.l<=0) ps.splice(i,1);
            });
            requestAnimationFrame(run);
        }
        run();
    </script>
</body>
</html>

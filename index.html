<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teal Future OS - Elite</title>
    <style>
        :root {
            --teal: #00f2ff;
            --dark-teal: #004d4d;
            --bg: #050b0c;
        }

        body, html {
            margin: 0; padding: 0;
            background: var(--bg);
            color: var(--teal);
            font-family: 'Courier New', monospace;
            overflow: hidden; height: 100vh;
        }

        #canvas { position: absolute; top: 0; left: 0; z-index: 1; }

        /* 右上角工具栏 */
        .tools {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        .tool-btn {
            background: rgba(0, 242, 255, 0.1);
            border: 1px solid var(--teal);
            color: var(--teal);
            padding: 5px 15px;
            cursor: pointer;
            font-size: 12px;
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }

        .tool-btn:hover { background: var(--teal); color: var(--bg); }

        .main-interface {
            position: relative; z-index: 10;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            height: 100vh; pointer-events: none;
        }

        .clock-wrapper {
            position: relative; width: 350px; height: 350px;
            display: flex; justify-content: center; align-items: center;
            pointer-events: auto;
        }

        .energy-ring { position: absolute; transform: rotate(-90deg); filter: drop-shadow(0 0 10px var(--teal)); }
        .ring-progress { fill: none; stroke: var(--teal); stroke-width: 2; stroke-dasharray: 880; stroke-dashoffset: 880; transition: stroke-dashoffset 1s linear; }

        #time { font-size: 64px; font-weight: bold; text-shadow: 0 0 20px var(--teal); }
        
        #controls { pointer-events: auto; margin-top: 30px; text-align: center; }
        
        .control-btn {
            background: transparent; border: 1px solid var(--teal);
            color: var(--teal); padding: 10px 20px;
            cursor: pointer; margin: 0 5px;
            font-size: 12px;
        }

        #song-title { font-size: 10px; margin-top: 10px; opacity: 0.6; }

        #log-container {
            position: absolute; bottom: 20px; left: 20px;
            width: 300px; height: 120px; font-size: 10px;
            color: var(--dark-teal); overflow: hidden;
            display: flex; flex-direction: column-reverse;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="tools">
        <button class="tool-btn" onclick="toggleFullScreen()">FULLSCREEN MODE</button>
    </div>

    <div id="log-container"></div>

    <div class="main-interface">
        <div class="clock-wrapper">
            <svg class="energy-ring" width="320" height="320">
                <circle id="progress-bar" class="ring-progress" cx="160" cy="160" r="140"></circle>
            </svg>
            <div style="text-align: center;">
                <div id="time">00:00:00</div>
                <div id="date" style="letter-spacing: 2px; font-size: 14px;">SYNCING...</div>
            </div>
        </div>

        <div id="controls">
            <button class="control-btn" id="play-btn">START CORE AUDIO</button>
            <button class="control-btn" id="next-btn">NEXT TRACK</button>
            <div id="song-title">NO TRACK LOADED</div>
        </div>
        
        <audio id="song" loop></audio>
    </div>

    <script>
        // --- 1. 歌曲库功能 ---
        // 在这里添加你的新歌：只需在数组里增加对象
        const playlist = [
            { name: "Cyber Dreams", url: "song.mp3" },
            { name: "Teal Protocol", url: "song1.mp3" }
        ];
        let currentTrackIndex = 0;

        const song = document.getElementById('song');
        const songTitle = document.getElementById('song-title');
        const playBtn = document.getElementById('play-btn');

        function loadTrack(index) {
            const track = playlist[index];
            song.src = track.url;
            songTitle.innerText = `NOW PLAYING: ${track.name}`;
        }

        loadTrack(0); // 初始加载第一首歌

        playBtn.addEventListener('click', () => {
            if (song.paused) {
                song.play();
                playBtn.innerText = "HALT AUDIO";
            } else {
                song.pause();
                playBtn.innerText = "START AUDIO";
            }
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            song.play();
            playBtn.innerText = "HALT AUDIO";
        });

        // --- 2. 全屏切换功能 ---
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // --- (保留之前的粒子和时钟逻辑) ---
        const timeEl = document.getElementById('time');
        const dateEl = document.getElementById('date');
        const progressBar = document.getElementById('progress-bar');
        const CIRCUMFERENCE = 2 * Math.PI * 140;

        function updateClock() {
            const now = new Date();
            timeEl.innerText = now.toLocaleTimeString('en-GB');
            dateEl.innerText = now.toDateString().toUpperCase();
            const s = now.getSeconds();
            progressBar.style.strokeDashoffset = CIRCUMFERENCE - (s / 60) * CIRCUMFERENCE;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 粒子背景 (简略版，逻辑同上)
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        window.onresize();
        class P { constructor(x,y){this.x=x;this.y=y;this.l=1;this.s=Math.random()*2;} update(){this.x+=Math.random()*2-1;this.y+=Math.random()*2-1;this.l-=0.01;} draw(){ctx.fillStyle=`rgba(0,242,255,${this.l})`;ctx.beginPath();ctx.arc(this.x,this.y,this.s,0,7);ctx.fill();}}
        window.onmousemove = (e) => { for(let i=0;i<2;i++) particles.push(new P(e.x,e.y)) };
        function anim() { ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach((p,i)=>{p.update();p.draw();if(p.l<=0)particles.splice(i,1)}); requestAnimationFrame(anim); }
        anim();
    </script>
</body>
</html>

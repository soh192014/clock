<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Console v4.0 - Pro</title>
    <link rel="icon" href="Screenshot_20260510_203622_com_android_chrome_CustomTabActivity_edit_855563587456178.jpg" type="image/jpeg">
    <style>
        :root { --teal: #00f2ff; --bg: #050b0c; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: var(--teal); font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; }
        #bg-canvas { position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* 顶部状态栏 */
        #status-bar { position: absolute; top: 25px; left: 30px; z-index: 100; font-size: 11px; display: flex; flex-direction: column; gap: 8px; background: rgba(0, 242, 255, 0.05); padding: 12px; border: 1px solid rgba(0, 242, 255, 0.2); backdrop-filter: blur(5px); }
        .stat-item { display: flex; align-items: center; gap: 10px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 10px var(--teal); }

        #log-window { position: absolute; bottom: 30px; left: 30px; width: 350px; height: 120px; border-left: 2px solid var(--teal); padding: 10px; font-size: 11px; z-index: 100; display: flex; flex-direction: column-reverse; overflow: hidden; }
        .log-line { margin-bottom: 4px; opacity: 0.7; }

        /* 主界面容器 */
        .main-interface { position: relative; z-index: 10; display: flex; flex-direction: column; justify-content: space-around; align-items: center; height: 100vh; width: 100%; padding: 40px 0; box-sizing: border-box; pointer-events: none; }
        
        /* 垂直音量条控制 */
        #volume-panel { position: absolute; right: 40px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 15px; pointer-events: auto; z-index: 100; }
        #volume-slider-container { width: 4px; height: 200px; background: rgba(0, 242, 255, 0.1); border: 1px solid rgba(0, 242, 255, 0.2); position: relative; cursor: pointer; }
        #volume-fill { position: absolute; bottom: 0; width: 100%; background: var(--teal); height: 80%; box-shadow: 0 0 15px var(--teal); transition: height 0.1s; }
        .vol-label { font-size: 10px; writing-mode: vertical-lr; text-orientation: upright; opacity: 0.6; letter-spacing: 2px; }

        .clock-wrapper { position: relative; width: 560px; height: 560px; display: flex; justify-content: center; align-items: center; pointer-events: auto; }
        .energy-ring { position: absolute; transform: rotate(-90deg); filter: drop-shadow(0 0 15px var(--teal)); }
        .ring-progress { fill: none; stroke: var(--teal); stroke-width: 4; stroke-dasharray: 1696; stroke-dashoffset: 1696; transition: stroke-dashoffset 1s linear; }
        #time { font-size: 100px; font-weight: bold; text-shadow: 0 0 25px var(--teal); }
        #date { font-size: 18px; letter-spacing: 5px; opacity: 0.6; margin-top: 10px; }

        #player-container { width: 450px; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: auto; }
        #viz-container { width: 100%; height: 60px; }
        #timeline-container { width: 100%; height: 2px; background: rgba(0, 242, 255, 0.1); cursor: pointer; position: relative; }
        #timeline-fill { height: 100%; background: var(--teal); width: 0%; }
        #time-display { width: 100%; display: flex; justify-content: space-between; font-size: 9px; opacity: 0.5; }

        #controls { pointer-events: auto; text-align: center; margin-top: 10px; }
        .control-btn { background: transparent; border: 1px solid var(--teal); color: var(--teal); padding: 10px 20px; cursor: pointer; margin: 0 5px; font-size: 11px; }
        .control-btn:hover { background: rgba(0, 242, 255, 0.1); }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    
    <div id="status-bar">
        <div class="stat-item"><div class="dot"></div><span id="wifi-signal">WiFi: SCANNING...</span></div>
        <div class="stat-item"><div class="dot"></div><span id="location-text">LOC: ACQUIRING...</span></div>
    </div>

    <div id="log-window"></div>

    <div id="volume-panel">
        <span class="vol-label">VOL</span>
        <div id="volume-slider-container">
            <div id="volume-fill"></div>
        </div>
        <span id="vol-percent" style="font-size: 10px;">80%</span>
    </div>

    <div class="main-interface">
        <div class="clock-wrapper">
            <svg class="energy-ring" width="560" height="560">
                <circle cx="280" cy="280" r="270" fill="none" stroke="rgba(0,242,255,0.05)" stroke-width="2"></circle>
                <circle id="progress-bar" class="ring-progress" cx="280" cy="280" r="270"></circle>
            </svg>
            <div style="text-align: center;">
                <div id="time">00:00:00</div>
                <div id="date">SYNCING...</div>
            </div>
        </div>

        <div id="player-container">
            <div id="viz-container"><canvas id="wave-canvas"></canvas></div>
            <div id="timeline-container"><div id="timeline-fill"></div></div>
            <div id="time-display"><span id="curr-time">0:00</span><span id="total-time">0:00</span></div>

            <div id="controls">
                <div id="status-info" style="font-size: 10px; margin-bottom: 15px; opacity: 0.5;">OS READY</div>
                <button class="control-btn" id="play-btn">Connect</button>
                <button class="control-btn" id="next-btn">Next</button>
            </div>
        </div>
        
        <audio id="song" loop crossOrigin="anonymous"></audio>
    </div>

    <script>
        const logWindow = document.getElementById('log-window');
        const audio = document.getElementById('song');
        const timelineFill = document.getElementById('timeline-fill');
        const volFill = document.getElementById('volume-fill');
        const volPercent = document.getElementById('vol-percent');

        function pushLog(msg) {
            const line = document.createElement('div');
            line.className = 'log-line';
            line.innerText = `> ${msg}`;
            logWindow.prepend(line);
            if(logWindow.childNodes.length > 8) logWindow.lastChild.remove();
        }

        const playlist = [
            { n: "Atlas Relax", u: "atlasaudio-relax-511892.mp3" },
            { n: "Mountain Relax", u: "the_mountain-relax-508021 (1).mp3" },
            { n: "Fire Aura", u: "02.%20Fire%20Aura.mp3" }
        ];
        let idx = 0;

        // 音量控制逻辑
        const volContainer = document.getElementById('volume-slider-container');
        function setVolume(e) {
            const rect = volContainer.getBoundingClientRect();
            let offsetY = e.clientY - rect.top;
            let pct = 1 - (offsetY / rect.height);
            pct = Math.max(0, Math.min(1, pct)); // 限制在0-1之间
            audio.volume = pct;
            volFill.style.height = (pct * 100) + '%';
            const displayVol = Math.round(pct * 100);
            volPercent.innerText = displayVol + '%';
            
            if(displayVol === 0) pushLog("AUDIO MUTED");
            else if(displayVol % 20 === 0) pushLog(`VOLUME: ${displayVol}%`); // 减少日志刷屏，整十显示
        }

        volContainer.onmousedown = (e) => {
            setVolume(e);
            window.onmousemove = setVolume;
            window.onmouseup = () => window.onmousemove = null;
        };

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec < 10 ? '0' : ''}${sec}`;
        }

            const pct = (audio.currentTime / audio.duration) * 100;
            timelineFill.style.width = pct

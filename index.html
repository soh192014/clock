<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teal Future OS - Elite</title>
    <style>
        :root {
            --teal: #00f2ff;
            --dark-teal: #004d4d;
            --bg: #050b0c;
        }

        body, html {
            margin: 0; padding: 0;
            background: var(--bg);
            color: var(--teal);
            font-family: 'Courier New', monospace;
            overflow: hidden; height: 100vh;
        }

        #canvas { position: absolute; top: 0; left: 0; z-index: 1; }

        .tools {
            position: absolute; top: 20px; right: 20px; z-index: 100;
        }

        .tool-btn {
            background: rgba(0, 242, 255, 0.1);
            border: 1px solid var(--teal);
            color: var(--teal);
            padding: 5px 15px;
            cursor: pointer;
            font-size: 12px;
            backdrop-filter: blur(5px);
            transition: 0.3s;
            pointer-events: auto;
        }

        .tool-btn:hover { background: var(--teal); color: var(--bg); }

        .main-interface {
            position: relative; z-index: 10;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            height: 100vh; pointer-events: none;
        }

        .clock-wrapper {
            position: relative; width: 350px; height: 350px;
            display: flex; justify-content: center; align-items: center;
            pointer-events: auto;
        }

        .energy-ring { position: absolute; transform: rotate(-90deg); filter: drop-shadow(0 0 10px var(--teal)); }
        .ring-progress { fill: none; stroke: var(--teal); stroke-width: 2; stroke-dasharray: 880; stroke-dashoffset: 880; transition: stroke-dashoffset 1s linear; }

        #time { font-size: 64px; font-weight: bold; text-shadow: 0 0 20px var(--teal); }
        
        #controls { pointer-events: auto; margin-top: 30px; text-align: center; }
        
        .control-btn {
            background: transparent; border: 1px solid var(--teal);
            color: var(--teal); padding: 10px 20px;
            cursor: pointer; margin: 0 5px;
            font-size: 12px;
        }

        #song-title { font-size: 10px; margin-top: 10px; opacity: 0.6; }

        /* 系统日志样式 */
        #log-container {
            position: absolute; bottom: 20px; left: 20px;
            width: 350px; height: 150px; font-size: 11px;
            color: #008080; overflow: hidden;
            display: flex; flex-direction: column-reverse;
            z-index: 100;
            pointer-events: none;
        }
        .log-entry { margin-bottom: 4px; animation: flash 0.2s; }
        @keyframes flash { from { color: white; } to { color: #008080; } }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="tools">
        <button class="tool-btn" onclick="toggleFullScreen()">[ FULLSCREEN MODE ]</button>
    </div>

    <div id="log-container"></div>

    <div class="main-interface">
        <div class="clock-wrapper">
            <svg class="energy-ring" width="320" height="320">
                <circle id="progress-bar" class="ring-progress" cx="160" cy="160" r="140"></circle>
            </svg>
            <div style="text-align: center;">
                <div id="time">00:00:00</div>
                <div id="date" style="letter-spacing: 2px; font-size: 14px;">BOOTING SYSTEM...</div>
            </div>
        </div>

        <div id="controls">
            <button class="control-btn" id="play-btn">START CORE AUDIO</button>
            <button class="control-btn" id="next-btn">NEXT TRACK</button>
            <div id="song-title">AUDIO SYSTEM READY</div>
        </div>
        
        <audio id="song" loop preload="auto"></audio>
    </div>

    <script>
        // --- 1. 日志系统 ---
        const logBox = document.getElementById('log-container');
        function addLog(msg, isError = false) {
            const div = document.createElement('div');
            div.className = 'log-entry';
            if(isError) div.style.color = '#ff4d4d';
            div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logBox.prepend(div);
            if(logBox.childNodes.length > 10) logBox.lastChild.remove();
        }

        // --- 2. 歌曲库 (请务必确认文件名大小写) ---
        const playlist = [
            { name: "Atlas Relax", url: "atlasaudio-relax-511892.mp3" },
            { name: "Teal Protocol", url: "the_mountain-relax-508021 (1).mp3" }
        ];
        let currentTrackIndex = 0;

        const song = document.getElementById('song');
        const songTitle = document.getElementById('song-title');
        const playBtn = document.getElementById('play-btn');

        function loadTrack(index) {
            const track = playlist[index];
            song.src = track.url;
            songTitle.innerText = `NOW PLAYING: ${track.name}`;
            addLog(`LOADING TRACK: ${track.name}...`);
            
            // 监测加载错误
            song.onerror = () => {
                addLog(`ERROR: CANNOT FIND ${track.url}`, true);
                songTitle.innerText = "FILE NOT FOUND ON SERVER";
            };
        }

        loadTrack(0);

        playBtn.addEventListener('click', () => {
            if (song.paused) {
                song.play().then(() => {
                    playBtn.innerText = "HALT AUDIO";
                    addLog("AUDIO STREAM ESTABLISHED.");
                }).catch(err => {
                    addLog("INTERACTION REQUIRED TO START AUDIO", true);
                });
            } else {
                song.pause();
                playBtn.innerText = "START AUDIO";
                addLog("AUDIO STREAM TERMINATED.");
            }
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            song.play();
            playBtn.innerText = "HALT AUDIO";
        });

        // --- 3. 全屏功能 ---
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                addLog("FULLSCREEN MODE ENGAGED.");
            } else {
                document.exitFullscreen();
                addLog("FULLSCREEN MODE TERMINATED.");
            }
        }

        // --- 4. 时钟逻辑 ---
        const timeEl = document.getElementById('time');
        const dateEl = document.getElementById('date');
        const progressBar = document.getElementById('progress-bar');
        const CIRCUMFERENCE = 2 * Math.PI * 140;

        function updateClock() {
            const now = new Date();
            timeEl.innerText = now.toLocaleTimeString('en-GB');
            dateEl.innerText = now.toDateString().toUpperCase();
            const s = now.getSeconds();
            progressBar.style.strokeDashoffset = CIRCUMFERENCE - (s / 60) * CIRCUMFERENCE;
        }
        setInterval(updateClock, 1000);
        updateClock();
        addLog("SYSTEM CLOCK SYNCED.");

        // --- 5. 粒子背景 ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
        window.onresize();
        class P { constructor(x,y){this.x=x;this.y=y;this.l=1;this.s=Math.random()*2;} update(){this.x+=Math.random()*2-1;this.y+=Math.random()*2-1;this.l-=0.01;} draw(){ctx.fillStyle=`rgba(0,242,255,${this.l})`;ctx.beginPath();ctx.arc(this.x,this.y,this.s,0,7);ctx.fill();}}
        window.onmousemove = (e) => { for(let i=0;i<2;i++) particles.push(new P(e.x,e.y)) };
        function anim() { ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach((p,i)=>{p.update();p.draw();if(p.l<=0)particles.splice(i,1)}); requestAnimationFrame(anim); }
        anim();
    </script>
</body>
</html>
